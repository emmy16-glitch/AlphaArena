name: AlphaArena CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install frontend dependencies
        run: npm ci --no-fund --no-audit
      - name: TypeScript strict check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  browser:
    name: Playwright ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project:
          - desktop-chromium
          - desktop-firefox
          - desktop-webkit
          - iphone-13
          - pixel-5
          - tablet
          - narrow-320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install frontend dependencies
        run: npm ci --no-fund --no-audit
      - name: Install browser
        run: npx playwright install --with-deps ${{ contains(matrix.project, 'firefox') && 'firefox' || contains(matrix.project, 'webkit') && 'webkit' || 'chromium' }}
      - name: Run responsive product tests
        run: npx playwright test --project=${{ matrix.project }}
      - name: Upload Playwright evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 5

  backend:
    name: Backend quality and safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check app tests
      - name: Unit, budget and safety tests
        run: pytest -q
      - name: Compile backend
        run: python -m compileall -q app
      - name: Import FastAPI application
        run: python -c "from app.main import app; assert app.title == 'AlphaArena API'; assert app.version == '0.5.0'; print(app.version)"

  vibe-smoke:
    name: Vibe-Trading sidecar smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-vibe.txt
      - run: pip install -r requirements-vibe.txt
      - name: Verify pinned Vibe-Trading package and MCP executable
        run: |
          python -c "import importlib.metadata as m; assert m.version('vibe-trading-ai') == '0.1.15'; print(m.version('vibe-trading-ai'))"
          vibe-trading-mcp --help
      - name: Verify shell tools stay disabled in deployment
        run: grep -q 'VIBE_TRADING_ENABLE_SHELL_TOOLS=0' Dockerfile.vibe
